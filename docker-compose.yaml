version: "3.8"

services:
  client:
    build: ./client
    container_name: clientapp_c
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build: ./app
    container_name: serverapp_c
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/taskmanager
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo_c
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: